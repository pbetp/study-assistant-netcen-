# Tool configuration only. Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (unused imports/variables),
# I = import sorting, B = common bug patterns, UP = modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from app.ingest import ...` without installing the project
pythonpath = ["."]
