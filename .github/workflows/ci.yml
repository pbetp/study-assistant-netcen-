# Runs on every push and pull request: lint, then the Python tests, then the JavaScript tests.
# Everything is offline (fake embedder), so no model download or API key is needed.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      # The search logic of the web page (site/search.js) is a port of app/search.py.
      - run: node --test site/search.test.mjs
